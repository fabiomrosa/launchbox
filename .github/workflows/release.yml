name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # release creation
  packages: write # pushing packages

jobs:
  distribute:
    name: Publish Binaries & Packages
    runs-on: ubuntu-latest

    env:
      APP_NAME: launchbox
      TAP_REPO: fabiomrosa/homebrew-launchbox

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24.0"

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: 📦 Install dependencies (if any)
        run: npm install

      - name: 🚀 Publish to npm (public test)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: 🏷 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" || \
          gh release create "${{ github.ref_name }}" --generate-notes

      - name: 📤 Upload binaries to GitHub Release with Labeled binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            bin/${APP_NAME}-darwin-arm64 \
            bin/${APP_NAME}-darwin-amd64 \
            bin/${APP_NAME}-linux-amd64 \
            --clobber

      - name: 🧪 Clone Homebrew tap repo
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAP_DIR=$(basename "$TAP_REPO")

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" "$TAP_DIR"

          mkdir -p "${TAP_DIR}/bin"
          mkdir -p "${TAP_DIR}/Formula"

          cp bin/${APP_NAME}-* "${TAP_DIR}/bin/"
          cp "formula/${APP_NAME}.rb" "${TAP_DIR}/Formula/${APP_NAME}.rb"

          cd "$TAP_DIR"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git"
          git add .
          if git commit -m "release: ${APP_NAME} ${GITHUB_REF_NAME}"; then
            DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}' || echo "main")
            git push origin HEAD:"$DEFAULT_BRANCH"
          else
            echo "Nothing new to commit or push"
          fi

      - name: 🏷 Create Release in homebrew-launchbox
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$TAP_REPO" || \
          gh release create "$GITHUB_REF_NAME" \
            --repo "$TAP_REPO" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated release for $APP_NAME $GITHUB_REF_NAME"

      - name: 📤 Upload binaries to homebrew-launchbox release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            bin/${APP_NAME}-darwin-arm64 \
            bin/${APP_NAME}-darwin-amd64 \
            bin/${APP_NAME}-linux-amd64 \
            --repo "$TAP_REPO" \
            --clobber
